<div
	class="pr-icon-text-input"
	[class.disabled]="disabled"
	[class.invalid]="invalid"
>
	<svg class="pr-icon-text-input-gradient" aria-hidden="true" focusable="false">
		<defs>
			<linearGradient [attr.id]="gradientId" x1="0" y1="0" x2="1" y2="0">
				<stop class="pr-icon-gradient-start" offset="0%" />
				<stop class="pr-icon-gradient-end" offset="100%" />
			</linearGradient>
		</defs>
	</svg>
	<span
		class="pr-icon-text-input-icon"
		aria-hidden="true"
		[style.--pr-icon-text-input-fill]="iconFill"
	>
		<fa-icon [icon]="icon" />
	</span>
	<input
		type="text"
		class="pr-icon-text-input-control"
		[value]="value"
		[placeholder]="label"
		[attr.aria-label]="label"
		[disabled]="disabled"
		(input)="onInput($event)"
	/>
	@if (value) {
		<!-- Safari and Firefox do not focus a button on mousedown; without this
		the field blurs and this button hides before the click lands. -->
		<button
			type="button"
			class="pr-icon-text-input-clear"
			[attr.aria-label]="'Clear ' + label"
			(mousedown)="$event.preventDefault()"
			(click)="clear()"
		>
			<i class="material-icons">cancel</i>
		</button>
	}
</div>
