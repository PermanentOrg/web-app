<div
	class="pr-video-wrapper"
	[ngClass]="{
		tall: item.imageRatio > 1,
		processing: isProcessing,
		loading: isLoading
	}"
>
	<video
		[attr.aria-label]="item | getAltText"
		[src]="videoSrc"
		controls
	></video>
	<div class="lds-dual-ring loader"></div>
	@if (isProcessing) {
		<div class="message">
			This video is processing.
			<br />
			<br />
			Please check back later.
		</div>
	}
</div>
