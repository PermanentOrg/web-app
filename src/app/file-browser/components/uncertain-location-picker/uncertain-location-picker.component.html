<!-- The gradient every `pr-icon-text-input` below fills its icon from. -->
<svg class="pr-icon-gradient-defs" aria-hidden="true" focusable="false">
	<defs>
		<linearGradient [attr.id]="iconGradientId" x1="0" y1="0" x2="1" y2="0">
			<stop class="pr-icon-gradient-start" offset="0%" />
			<stop class="pr-icon-gradient-end" offset="100%" />
		</linearGradient>
	</defs>
</svg>

<div class="pr-uncertain-location-dialog">
	<div class="pr-dialog-header">
		<h2>Add a place or address…</h2>
		<button
			type="button"
			class="pr-close-button"
			aria-label="Close"
			(click)="cancel()"
		>
			<i class="material-icons">close</i>
		</button>
	</div>

	<div class="pr-dialog-content">
		<div class="pr-qualifiers-row">
			<span class="pr-qualifiers-label">This place is:</span>
			@for (option of qualifierOptions; track option.key) {
				<label class="pr-qualifier-option">
					<span class="pr-qualifier-option-label">{{ option.label }}</span>
					<span class="pr-toggle">
						<input
							type="checkbox"
							[checked]="qualifiers()[option.key]"
							[disabled]="
								option.key !== LocationQualifier.Unknown && fieldsDisabled()
							"
							(change)="onQualifierChange(option.key)"
						/>
						<span class="pr-toggle-slider"></span>
					</span>
				</label>
			}
		</div>

		<pr-icon-text-input
			[icon]="nameIcon"
			label="Name this place"
			[disabled]="fieldsDisabled()"
			[value]="location().name ?? ''"
			(valueChange)="setField('name', $event)"
		/>

		<div class="pr-address-fields">
			@for (field of fields; track field.key) {
				<pr-icon-text-input
					[icon]="field.icon"
					[label]="field.label"
					[disabled]="fieldsDisabled()"
					[value]="location()[field.key] ?? ''"
					(valueChange)="setField(field.key, $event)"
				/>
			}
		</div>
	</div>

	<div class="pr-dialog-footer">
		<button type="button" class="pr-clear-link" (click)="clearAll()">
			<i class="material-icons">backspace</i>
			<span>Clear place and address</span>
		</button>
		<div class="pr-dialog-actions">
			<button type="button" class="pr-btn-cancel" (click)="cancel()">
				Cancel
			</button>
			<button type="button" class="pr-btn-save" (click)="save()">Save</button>
		</div>
	</div>
</div>
